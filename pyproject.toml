[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailorder"
version = "0.1.0"
description = "An agent workflow that turns free-form shipment request e-mails into quoted orders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baha Kırbaşoğlu" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
azure = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mailorder = "mailorder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
